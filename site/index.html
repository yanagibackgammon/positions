<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Backgammon Positions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="title-group">
      <h1 id="page-title">Backgammon Positions</h1>
      <span class="creator">Created by YANAGI Backgammon</span>
    </div>
    <div class="header-filter">
      <select id="type-filter" aria-label="Position type filter">
        <option value="">All</option>
        <option value="checker">Checker Play</option>
        <option value="double">Double Decision</option>
        <option value="take">Take / Pass</option>
      </select>
    </div>
  </header>

  <nav class="sort-toolbar-wrap" aria-label="Sort positions">
    <div class="sort-toolbar">
      <span id="position-count" class="position-count">0 positions</span>
      <button class="sort-button" type="button" data-sort-key="bestAction" data-sort-type="text">BEST<span class="sort-indicator"></span></button>
      <button class="sort-button" type="button" data-sort-key="matchLength" data-sort-type="number">ML<span class="sort-indicator"></span></button>
      <button class="sort-button sort-bk" type="button" data-sort-key="playerAway" data-sort-type="number">BK<span class="sort-indicator"></span></button>
      <button class="sort-button sort-wh" type="button" data-sort-key="opponentAway" data-sort-type="number">WH<span class="sort-indicator"></span></button>
      <button class="sort-button" type="button" data-sort-key="winRate" data-sort-type="number">W<span class="sort-indicator"></span></button>
      <button class="sort-button" type="button" data-sort-key="gammonWinRate" data-sort-type="number">GW<span class="sort-indicator"></span></button>
      <button class="sort-button" type="button" data-sort-key="loseRate" data-sort-type="number">L<span class="sort-indicator"></span></button>
      <button class="sort-button" type="button" data-sort-key="gammonLoseRate" data-sort-type="number">GL<span class="sort-indicator"></span></button>
    </div>
  </nav>

  <main>
    <section class="table-card">
      <div class="table-scroll">
        <table aria-label="Backgammon positions">
          <colgroup>
            <col class="board-col">
            <col class="best-col">
            <col class="summary-col">
          </colgroup>
          <tbody id="positions-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        条件に一致するポジションがありません。
      </div>
    </section>
  </main>

  <dialog id="board-dialog">
    <button id="dialog-close" type="button" aria-label="閉じる">×</button>
    <img id="dialog-image" alt="拡大したバックギャモンポジション">
  </dialog>

  <script src="app.js"></script>
</body>
</html>
