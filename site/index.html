<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Backgammon Positions</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="title-group">
      <h1 id="page-title">Backgammon 0 Positions</h1>
      <span class="creator">Created by YANAGI Backgammon</span>
    </div>
  </header>

  <nav class="sort-toolbar-wrap" aria-label="Sort positions">
    <div class="sort-toolbar">
      <div class="toolbar-filter">
        <select id="type-filter" aria-label="Position type filter">
          <option value="">All</option>
          <option value="checker">Checker Play</option>
          <option value="cube">Cube Action</option>
        </select>
      </div>
      <button class="sort-button sort-black" type="button" data-sort-key="playerAway" data-sort-type="number">BK<span class="sort-indicator"></span></button>
      <button class="sort-button sort-black" type="button" data-sort-key="blackPip" data-sort-type="number">PIP<span class="sort-indicator"></span></button>
      <button class="sort-button sort-black" type="button" data-sort-key="winRate" data-sort-type="number">W<span class="sort-indicator"></span></button>
      <button class="sort-button sort-black" type="button" data-sort-key="gammonWinRate" data-sort-type="number">GW<span class="sort-indicator"></span></button>

      <button class="sort-button sort-gold" type="button" data-sort-key="matchLength" data-sort-type="number">ML<span class="sort-indicator"></span></button>
      <button class="sort-button sort-gold" type="button" data-sort-key="cubeSortValue" data-sort-type="number">CB<span class="sort-indicator"></span></button>

      <button class="sort-button sort-white" type="button" data-sort-key="opponentAway" data-sort-type="number">WH<span class="sort-indicator"></span></button>
      <button class="sort-button sort-white" type="button" data-sort-key="whitePip" data-sort-type="number">PIP<span class="sort-indicator"></span></button>
      <button class="sort-button sort-white" type="button" data-sort-key="loseRate" data-sort-type="number">W<span class="sort-indicator"></span></button>
      <button class="sort-button sort-white" type="button" data-sort-key="gammonLoseRate" data-sort-type="number">GW<span class="sort-indicator"></span></button>
    </div>
  </nav>

  <main>
    <section class="table-card">
      <div class="table-scroll">
        <table aria-label="Backgammon positions">
          <colgroup>
            <col class="board-col">
            <col class="best-col">
            <col class="summary-col">
          </colgroup>
          <tbody id="positions-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        条件に一致するポジションがありません。
      </div>
    </section>
  </main>

  <dialog id="board-dialog">
    <button id="dialog-close" type="button" aria-label="閉じる">×</button>
    <div class="dialog-content">
      <img id="dialog-image" alt="拡大したバックギャモンポジション">
      <div id="dialog-source" class="dialog-source"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
