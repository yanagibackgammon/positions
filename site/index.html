<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Backgammon Positions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div class="title-group">
      <h1 id="page-title">Backgammon Positions</h1>
      <span class="creator">Created by YANAGI Backgammon</span>
    </div>
    <div class="header-filter">
      <select id="type-filter" aria-label="判断種別">
        <option value="">All</option>
        <option value="checker">Checker Play</option>
        <option value="double">Double Decision</option>
        <option value="take">Take / Pass</option>
      </select>
    </div>
  </header>

  <main>
    <section class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="board-column" id="board-header">0 positions</th>
              <th><button type="button" data-sort-key="bestAction" data-sort-type="text">BEST<span class="sort-indicator"></span></button></th>
              <th><button type="button" data-sort-key="matchLength" data-sort-type="number" title="Match Length">ML<span class="sort-indicator"></span></button></th>
              <th><button type="button" data-sort-key="playerAway" data-sort-type="number" title="You">YOU<span class="sort-indicator"></span></button></th>
              <th><button type="button" data-sort-key="opponentAway" data-sort-type="number" title="Opponent">OPP<span class="sort-indicator"></span></button></th>
              <th class="rates-header">
                <div class="rates-sort-grid" aria-label="Rates sort controls">
                  <button type="button" data-sort-key="winRate" data-sort-type="number" title="Win Rate">W%<span class="sort-indicator"></span></button>
                  <button type="button" data-sort-key="gammonWinRate" data-sort-type="number" title="Gammon Win Rate">GW%<span class="sort-indicator"></span></button>
                  <button type="button" data-sort-key="loseRate" data-sort-type="number" title="Lose Rate">L%<span class="sort-indicator"></span></button>
                  <button type="button" data-sort-key="gammonLoseRate" data-sort-type="number" title="Gammon Lose Rate">GL%<span class="sort-indicator"></span></button>
                </div>
              </th>
            </tr>
          </thead>
          <tbody id="positions-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        条件に一致するポジションがありません。
      </div>
    </section>
  </main>

  <dialog id="board-dialog">
    <button id="dialog-close" type="button" aria-label="閉じる">×</button>
    <img id="dialog-image" alt="拡大したバックギャモンポジション">
  </dialog>

  <script src="app.js"></script>
</body>
</html>
