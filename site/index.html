<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Backgammon Positions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <h1 id="page-title">Backgammon Positions</h1>
    <div class="header-filter">
      <select id="type-filter" aria-label="判断種別">
        <option value="">すべて</option>
        <option value="checker">Checker Play</option>
        <option value="double">Double Decision</option>
        <option value="take">Take / Pass</option>
      </select>
    </div>
  </header>

  <main>
    <section class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="board-column" id="board-header">0 positions</th>
              <th>BEST</th>
              <th>試合</th>
              <th>自分</th>
              <th>相手</th>
              <th>勝率</th>
              <th>G率</th>
              <th>負率</th>
              <th>G負率</th>
            </tr>
          </thead>
          <tbody id="positions-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        条件に一致するポジションがありません。
      </div>
    </section>
  </main>

  <dialog id="board-dialog">
    <button id="dialog-close" type="button" aria-label="閉じる">×</button>
    <img id="dialog-image" alt="拡大したバックギャモンポジション">
  </dialog>

  <script src="app.js"></script>
</body>
</html>
